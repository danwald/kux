apiVersion: v1
kind: Config
current-context: kind-kind
clusters:
- name: arn:aws:eks:us-east-1:111111111111:cluster/prod
  cluster: {server: 'https://prod-111.example:6443', certificate-authority-data: UFJPRENB}
- name: arn:aws:eks:eu-west-1:222222222222:cluster/prod
  cluster: {server: 'https://prod-222.example:6443'}
- name: arn:aws:eks:us-east-1:111111111111:cluster/staging
  cluster: {server: 'https://staging.example:6443'}
- name: gke_myproj_us-central1-a_dev
  cluster: {server: 'https://gke-dev.example:6443'}
- name: kind-kind
  cluster: {server: 'https://127.0.0.1:6443'}
contexts:
- name: arn:aws:eks:us-east-1:111111111111:cluster/prod
  context: {cluster: 'arn:aws:eks:us-east-1:111111111111:cluster/prod', user: 'arn:aws:eks:us-east-1:111111111111:cluster/prod', namespace: payments}
- name: arn:aws:eks:eu-west-1:222222222222:cluster/prod
  context: {cluster: 'arn:aws:eks:eu-west-1:222222222222:cluster/prod', user: 'arn:aws:eks:eu-west-1:222222222222:cluster/prod'}
- name: arn:aws:eks:us-east-1:111111111111:cluster/staging
  context: {cluster: 'arn:aws:eks:us-east-1:111111111111:cluster/staging', user: 'arn:aws:eks:us-east-1:111111111111:cluster/staging'}
- name: gke_myproj_us-central1-a_dev
  context: {cluster: gke_myproj_us-central1-a_dev, user: gke_myproj_us-central1-a_dev}
- name: kind-kind
  context: {cluster: kind-kind, user: kind-kind, namespace: kube-system}
users:
- name: arn:aws:eks:us-east-1:111111111111:cluster/prod
  user: {exec: {apiVersion: client.authentication.k8s.io/v1beta1, command: aws, args: [eks, get-token, --cluster-name, prod]}}
- name: arn:aws:eks:eu-west-1:222222222222:cluster/prod
  user: {exec: {apiVersion: client.authentication.k8s.io/v1beta1, command: aws, args: [eks, get-token, --cluster-name, prod]}}
- name: arn:aws:eks:us-east-1:111111111111:cluster/staging
  user: {exec: {apiVersion: client.authentication.k8s.io/v1beta1, command: aws, args: [eks, get-token, --cluster-name, staging]}}
- name: gke_myproj_us-central1-a_dev
  user: {token: GKETOKEN}
- name: kind-kind
  user: {token: KINDTOKEN}
